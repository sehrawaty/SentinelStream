server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CLAUDE.md §2 -- production build talks to the api container directly;
    # this reverse proxy is what lets the UI call /api/* with no CORS
    # configuration needed anywhere.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
