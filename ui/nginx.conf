server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CLAUDE.md §2 -- production build talks to the api container directly;
    # this reverse proxy is what lets the UI call /api/* with no CORS
    # configuration needed anywhere.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }

    # Slice 14 -- STOMP/SockJS endpoint. Needs the Upgrade/Connection headers
    # (not just proxy_pass) or nginx serves it as a plain HTTP proxy and the
    # WebSocket handshake never completes.
    location /ws/ {
        proxy_pass http://api:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
